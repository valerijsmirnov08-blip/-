<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="create_offer.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Создание предложения</h1>
    <div class="name_input">
        <input class="name" type="text" placeholder="Название">
    </div>
    <div id="upload_img_center" class="upload_img_center">
        <input type="file" id="upload_img_input" class="upload_img_input">
        <div class="upload_img">
            <p id="upload_img_text" class="upload_img_text">Загрузить фото</p>
        </div>
    </div>
    <div class="prise_center">
        <input class="prise" type="text" placeholder="Цена">      
    </div>

    <div class="discripton_center">
        <textarea class="discripton" id="" placeholder="Описание(не более 40 слов)"></textarea>  
    </div>

    <div class="buttons">
            <button id="back" class="back">Назад</button>
            <button id="create" class="create">Создать</button>
    </div>
    <script src="create_offer.js"></script>
</body>
</html>
